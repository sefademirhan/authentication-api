name: .NET build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore src/AuthenticationApi/AuthenticationApi.csproj
      - name: Build
        run: dotnet build src/AuthenticationApi/AuthenticationApi.csproj --configuration Release --no-restore
